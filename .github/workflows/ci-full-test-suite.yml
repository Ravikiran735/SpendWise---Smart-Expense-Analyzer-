name: Enterprise Full Quality Assurance CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # =========================================================================
  # SUITE 1: Mobile Appium E2E Automation (300 Reports)
  # =========================================================================
  mobile-appium-tests:
    name: 1. Appium Mobile Android (300 Reports)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android Debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Install Appium & Dependencies
        run: |
          npm install -g appium
          cd testing
          npm install

      - name: Execute Appium 300-Test Matrix & AI Smart Discovery
        run: |
          cd testing
          npm run test:ai-smart

      - name: Upload Appium Mobile Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 1-Mobile-Appium-Reports-300
          path: |
            testing/reports/React native_E2E_Report.xlsx
            testing/reports/mochawesome/
            testing/reports/failures/
            testing/reports/logs/
          retention-days: 30

  # =========================================================================
  # SUITE 2: Selenium Web E2E Automation (300 Reports)
  # =========================================================================
  selenium-web-tests:
    name: 2. Selenium Web React JS (300 Reports)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Chrome Headless
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install Test Dependencies
        run: |
          cd testing
          npm install

      - name: Start Local Web Server
        run: |
          cd server
          npm install
          node index.js &
          sleep 4

      - name: Execute Selenium 300-Test Web Matrix
        run: |
          cd testing
          npm run test:web

      - name: Upload Selenium Web Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2-Selenium-Web-Reports-300
          path: |
            testing/reports/Selenium_Web_Report.xlsx
            testing/reports/mochawesome/
          retention-days: 30

  # =========================================================================
  # SUITE 3: Load & Performance Testing (300 Scenarios)
  # =========================================================================
  load-performance-tests:
    name: 3. Load & Throughput Testing (300 Scenarios)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Test Dependencies
        run: |
          cd testing
          npm install

      - name: Start AI Microservice
        run: |
          cd server
          npm install
          node index.js &
          sleep 3

      - name: Run 300 Load Test Iterations
        run: |
          cd testing
          npm run test:load

      - name: Upload Load Testing Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 3-LoadTest-Performance-Reports-300
          path: |
            testing/reports/LoadTest_Report.html
            testing/reports/LoadTest_Report.json
          retention-days: 30

  # =========================================================================
  # SUITE 4: Security & Vulnerability Scanner (300 Rules)
  # =========================================================================
  vulnerability-security-tests:
    name: 4. Security & Vulnerability Scanner (300 Checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: |
          cd testing
          npm install

      - name: Execute SAST / DAST Vulnerability Engine (300 Rules)
        run: |
          cd testing
          npm run test:security

      - name: Upload Security Vulnerability Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 4-Security-Vulnerability-Reports-300
          path: |
            testing/reports/Security_Vulnerability_Report.xlsx
          retention-days: 30

  # =========================================================================
  # SUITE 5: Consolidated Master Dashboard & Artifact Aggregator
  # =========================================================================
  consolidate-artifacts:
    name: 5. Master Quality Summary & Dashboard
    needs: [ mobile-appium-tests, selenium-web-tests, load-performance-tests, vulnerability-security-tests ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies & Synthesize Master Dashboard
        run: |
          cd testing
          npm install
          npm run generate:reports

      - name: Upload Consolidated Master Dashboard
        uses: actions/upload-artifact@v4
        with:
          name: Consolidated-Master-Quality-Dashboard
          path: |
            testing/reports/index.html
          retention-days: 30
