name: React Native & Appium Mobile E2E Automation

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  appium-android-e2e:
    name: Appium Mobile E2E (300 Scenarios & Excel Reports)
    runs-on: ubuntu-latest

    env:
      APK_PATH: ./app/build/outputs/apk/debug/app-debug.apk
      APP_PACKAGE: com.spendwise.app
      APP_ACTIVITY: com.spendwise.app.MainActivity
      DEVICE_NAME: Pixel_6_API_33
      PLATFORM_VERSION: "13.0"
      APPIUM_AUTOMATION_NAME: UiAutomator2

    steps:
      # 1. Checkout Repository
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 3. Setup Java
      - name: 3. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. Build Android Debug APK
      - name: 4. Build Android APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      # 5. Install Appium & Test Dependencies
      - name: 5. Install Dependencies
        run: |
          npm install -g appium
          cd testing
          npm install

      # 6. Execute Appium 300-Test Matrix & AI Smart Discovery
      - name: 6. Execute Appium 300-Test Matrix & AI Smart Discovery
        run: |
          cd testing
          npm run test:ai-smart || npm run test:mobile

      # 7. Generate Consolidated Reports
      - name: 7. Generate Consolidated Reports
        if: always()
        run: |
          cd testing
          node src/utils/generateAllReports.js

      # 8. Upload Test Artifacts (Excel, Mochawesome, Screenshots, Logs)
      - name: 8. Upload Mobile Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-Appium-Reports-300
          path: |
            testing/reports/React native_E2E_Report.xlsx
            testing/reports/mochawesome/
            testing/reports/failures/
            testing/reports/logs/
            testing/reports/index.html
          retention-days: 30
