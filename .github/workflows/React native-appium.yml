name: React Native & Appium Mobile E2E Automation

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  appium-android-e2e:
    name: Appium Mobile E2E (300 Scenarios & Excel Reports)
    runs-on: macos-13 # macos runners support hardware acceleration for Android Emulators

    env:
      APK_PATH: ./app/build/outputs/apk/debug/app-debug.apk
      APP_PACKAGE: com.spendwise.app
      APP_ACTIVITY: com.spendwise.app.MainActivity
      DEVICE_NAME: Pixel_6_API_33
      PLATFORM_VERSION: "13.0"
      APPIUM_AUTOMATION_NAME: UiAutomator2

    steps:
      # 1. Checkout Repository
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: testing/package.json

      # 3. Setup Java
      - name: 3. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. Setup Android SDK
      - name: 4. Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. Build Android Debug APK
      - name: 5. Build Android APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      # 6 & 7. Install Appium and Drivers
      - name: 6. Install Appium & UiAutomator2 Driver
        run: |
          npm install -g appium
          appium driver install uiautomator2

      # 8. Install Test Framework Dependencies
      - name: 8. Install Test Dependencies
        run: |
          cd testing
          npm install

      # 9. Start Appium Server in Background
      - name: 9. Start Appium Server
        run: |
          appium --log-timestamp --log reports/appium.log &
          sleep 5

      # 10. Run Android Emulator & Execute Tests with AVD Cache
      - name: 10. Run Appium Tests on Android Emulator (API 33)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            adb install -r ${{ env.APK_PATH }}
            cd testing
            npm run test:ai-smart || npm run test:mobile

      # 11. Generate Consolidated Reports
      - name: 11. Generate Consolidated Reports
        if: always()
        run: |
          cd testing
          node src/utils/generateAllReports.js

      # 12. Upload Test Artifacts (Excel, Mochawesome, Screenshots, Logs)
      - name: 12. Upload Mobile Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-Appium-Reports-300
          path: |
            testing/reports/React native_E2E_Report.xlsx
            testing/reports/mochawesome/
            testing/reports/failures/
            testing/reports/logs/
            testing/reports/index.html
          retention-days: 30
